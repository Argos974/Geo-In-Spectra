<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geo-In-Spectra</title>
    <meta name="description" content="Ressources pédagogiques de géomatique et télédétection : fondamentaux SIG, imagerie satellite, indices spectraux, travaux pratiques." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Applique le thème stocké avant le premier rendu React, pour éviter un
      // flash du thème sombre par défaut si l'utilisateur a choisi le clair.
      try {
        var t = localStorage.getItem('geo-in-spectra-theme');
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
